<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DGIT_TAP</title>
    <link rel="stylesheet" href="/game.css">
    <script src="/sdk/arcade-sdk.js" defer></script>
    <script src="/game.js" defer></script>
  </head>
  <body data-accent="#c9ff61" data-game="DGIT_TAP">
    <main class="game">
      <span class="game-mark">01 / ARCADE</span>
      <h1>DGIT_TAP</h1>
      <p>Stack your points. Put your initials on the board.</p>
      <button class="tap-target" id="tap-target" type="button"><span class="tap-number" id="tap-number">00</span><span class="tap-copy">TAP TO SCORE</span></button>
      <form id="score-form"><input id="player-name" aria-label="Player name" maxlength="24" placeholder="YOUR NAME" autocomplete="nickname"><button type="submit">POST SCORE <span>↗</span></button></form>
      <span class="game-status" id="game-status" aria-live="polite">READY WHEN YOU ARE</span>
    </main>
  </body>
</html>
